name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Software quality (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Offline clinic regression
        run: npm run eval:fake
      - name: Local HTTP clinic regression
        run: npm run verify:http
      - name: Test StudyEval evaluator
        run: node --test eval/studyeval/test/*.test.mjs

  evidence-verification:
    name: Evidence verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify StudyEval v2.0 evidence
        run: node eval/studyeval-validation/scripts/verify.mjs
      - name: Verify Candidate 23 product evidence
        run: node eval/final-showcase/publication/verify.mjs
